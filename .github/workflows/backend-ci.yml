name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/backend_api/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/backend_api/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ustaadx
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ustaadx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('apps/backend_api/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      working-directory: apps/backend_api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      working-directory: apps/backend_api
      run: ruff check app/

    - name: Format check with Black
      working-directory: apps/backend_api
      run: black --check app/

    - name: Type check with mypy
      working-directory: apps/backend_api
      run: mypy app/
      continue-on-error: true

    - name: Run tests
      working-directory: apps/backend_api
      env:
        DATABASE_URL: postgresql://ustaadx:test_password@localhost:5432/ustaadx_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
      run: pytest --cov=app --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: apps/backend_api/coverage.xml
        flags: backend
